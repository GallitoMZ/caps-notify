[package]
name = "caps-notify"
version = "0.1.4"
edition = "2021"
authors = ["GallitoMZ"]
description = "Lightweight tray indicator for Caps/Num/Scroll Lock on Windows"
license = "MIT"
repository = "https://github.com/GallitoMZ/caps-notify"

[[bin]]
name = "caps-notify"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_Shell_PropertiesSystem",
    "Data_Xml_Dom",
    "UI_Notifications",
]}
serde = { version = "1", features = ["derive"] }
toml = "0.8"
once_cell = "1.19"

[build-dependencies]
embed-resource = "2.4"
